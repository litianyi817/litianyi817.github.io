<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Litianyi's travel plan - interactive route map with flight and rail details.">
  <title>Plan - Litianyi</title>
  <link rel="preload" href="/assets/bg.png" as="image">
  <link rel="stylesheet" href="/style.css?v=21">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>L</text></svg>">
  <style>
    .plan-glass { max-width: 1050px !important; }
    .plan-wrap {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      position: relative;
    }
    .plan-map { flex: 1; min-width: 0; position: relative; overflow: hidden; }
    .plan-map svg { width: 100%; height: auto; display: block; }
    .plan-sidebar {
      width: 155px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .plan-filter {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
      flex-wrap: nowrap;
    }
    .plan-filter button {
      padding: 0.2rem 0.45rem;
      font-size: 0.66rem;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: var(--font-sans);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .plan-filter button.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .plan-sidebar label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      cursor: pointer;
      padding: 0.25rem 0.4rem;
      border-radius: 5px;
      transition: all 0.15s ease;
    }
    .plan-sidebar label:hover { background: var(--bg-card); color: var(--text-primary); }
    .plan-sidebar input[type=checkbox] { accent-color: var(--accent); width: 12px; height: 12px; }
    .plan-sidebar .region-title {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-top: 0.4rem;
      margin-bottom: 0.1rem;
      padding-left: 0.4rem;
    }
    .plan-legend {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-top: 0.5rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .plan-legend span { display: flex; align-items: center; gap: 0.3rem; }
    .legend-rail { width: 24px; height: 2.5px; background: #3b82f6; border-radius: 1px; }
    .legend-flight { width: 24px; height: 0; border-top: 2px dashed rgba(255,255,255,0.5); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

    /* Tooltip */
    .tooltip {
      display: none;
      position: absolute;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      z-index: 50;
      pointer-events: none;
      font-size: 0.75rem;
      font-family: var(--font-sans);
      color: var(--text-primary);
      line-height: 1.6;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
    .tooltip .tt-flight { color: rgba(255,255,255,0.7); font-size: 0.68rem; }
    .tooltip .tt-rail { color: #60a5fa; font-size: 0.68rem; }
    .tooltip strong { color: var(--text-primary); }

    .route-rail { stroke: #3b82f6; stroke-width: 2.5; fill: none; opacity: 0.75; cursor: pointer; }
    .route-flight { stroke: rgba(255,255,255,0.55); stroke-width: 2; stroke-dasharray: 7 5; fill: none; cursor: pointer; }
    .route-hit { stroke: transparent; stroke-width: 18; fill: none; cursor: pointer; }
    .route-label { fill: var(--text-muted); font-size: 10px; font-family: var(--font-sans); }
    .city-dot { fill: var(--accent); stroke: var(--bg-primary); stroke-width: 2; }
    .city-label { fill: var(--text-secondary); font-size: 14px; font-family: var(--font-sans); font-weight: 500; }

    @media (max-width: 768px) {
      .plan-wrap { flex-direction: column; }
      .plan-sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 0.2rem; }
      .plan-sidebar .region-title { width: 100%; margin-top: 0.1rem; }
      .plan-sidebar label { font-size: 0.68rem; padding: 0.15rem 0.3rem; }
      .city-label { font-size: 11px; }
      .route-label { font-size: 8px; }
    }
  </style>
</head>
<body>

  <div id="header"></div>

  <main>
    <div class="glass-panel plan-glass">
      <div class="glass-panel-header">
        <a href="/" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          返回首页
        </a>
        <h1>Plan</h1>
      </div>
      <div class="glass-panel-body">
        <div class="plan-wrap">
          <div class="plan-sidebar" id="planSidebar">
            <div class="plan-filter">
              <button data-filter="all" class="active">全部</button>
              <button data-filter="flight">仅飞机</button>
              <button data-filter="rail">仅铁路</button>
            </div>
          </div>
          <div class="plan-map" id="planMapWrap">
            <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" id="planSvg"></svg>
            <div class="tooltip" id="tooltip"></div>
            <div class="plan-legend">
              <span><span class="legend-rail"></span> 铁路</span>
              <span><span class="legend-flight"></span> 航空</span>
              <span><span class="legend-dot"></span> 城市</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/script.js?v=21"></script>
  <script>
(function() {
  // labelOff: [dx, dy, anchor] — anchor: "start"=left of dot, "end"=right of dot
  var cities = [
    { id:"beijing",  name:"北京", en:"Beijing",  x:500,y:100, lx:-10,ly:-10,la:"end",   region:"china" },
    { id:"xian",     name:"西安", en:"Xi'an",    x:380,y:230, lx:-10,ly:-10,la:"end",   region:"china" },
    { id:"chengdu",  name:"成都", en:"Chengdu",  x:240,y:345, lx:-10,ly:-6,la:"end",   region:"china" },
    { id:"shanghai", name:"上海", en:"Shanghai", x:610,y:285, lx:12,ly:-10,la:"start", region:"china" },
    { id:"guangzhou",name:"广州", en:"Guangzhou",x:450,y:465, lx:12,ly:12,la:"start",  region:"china" },
    { id:"hongkong", name:"香港", en:"Hong Kong",x:490,y:510, lx:12,ly:8,la:"start",   region:"china" },
    { id:"seoul",    name:"首尔", en:"Seoul",    x:650,y:85,  lx:12,ly:-6,la:"start",  region:"korea" },
    { id:"busan",    name:"釜山", en:"Busan",    x:695,y:180, lx:-10,ly:-8,la:"end",   region:"korea" },
    { id:"jeju",     name:"济州", en:"Jeju",     x:665,y:235, lx:12,ly:4,la:"start",   region:"korea" },
    { id:"tokyo",    name:"东京", en:"Tokyo",    x:835,y:140, lx:12,ly:-6,la:"start",  region:"japan" },
    { id:"osaka",    name:"大阪", en:"Osaka",    x:795,y:225, lx:12,ly:-5,la:"start",  region:"japan" }
  ];

  var routes = [
    // === 真实数据 (来自机票-1.json) ===
    { from:"guangzhou",to:"seoul",  type:"flight", dist:"—", price:"¥1346", flight:"CX983", airline:"国泰航空", depAirport:"广州白云T3", arrAirport:"香港国际T1", plane:"A330-300", size:"大", time:"10:10-11:45",
      transfer:true, transferCity:"香港", flight2:"CX434", airline2:"国泰航空", depAirport2:"香港国际T1", arrAirport2:"首尔仁川T1", plane2:"A321", size2:"中", time2:"07:55-12:40", note:"全程仅部分税费可退，改期费800元起" },
    { from:"seoul",    to:"jeju",    type:"flight", dist:"—", price:"¥235",  flight:"ZE231", airline:"易斯达航空", depAirport:"首尔金浦", arrAirport:"济州岛国际", plane:"B737-800", size:"中", time:"19:20-20:35", note:"不得退改" },
    { from:"busan",    to:"jeju",    type:"flight", dist:"—", price:"¥311",  flight:"LJ569", airline:"真航空", depAirport:"釜山金海D", arrAirport:"济州岛国际", plane:"B737-800", size:"中", time:"19:00-20:00", note:"不得退票，改期费150元起" },
    { from:"seoul",    to:"tokyo",   type:"flight", dist:"—", price:"¥839",  flight:"7C1107",airline:"济州航空", depAirport:"首尔仁川T1", arrAirport:"东京成田T3", plane:"B737MAX8", size:"中", time:"15:00-17:30", note:"退票费100元起，改期费190元起" },
    { from:"seoul",    to:"osaka",   type:"flight", dist:"—", price:"¥620",  flight:"BX176", airline:"釜山航空", depAirport:"首尔仁川T2", arrAirport:"大阪关西T1", plane:"A321", size:"中", time:"14:50-17:10", note:"退票费480元起，改期费320元起" },
    // === 存疑路线 (示意数据，待确认) ===
    { from:"guangzhou",to:"hongkong",type:"rail",   dist:"140km", price:"¥80",   train:"G6581", info:"广深港高铁", dubious:true },
    { from:"seoul",  to:"busan",    type:"rail",   dist:"330km", price:"¥300",  train:"KTX101",info:"京釜高铁", dubious:true },
    { from:"tokyo",  to:"osaka",    type:"rail",   dist:"500km", price:"¥800",  train:"Nozomi1",info:"东海道新干线", dubious:true },
    { from:"chengdu",to:"guangzhou",type:"flight", dist:"1200km",price:"¥900",  flight:"CA431", airline:"中国国际航空", depAirport:"成都天府", arrAirport:"广州白云", plane:"A320", size:"中", dubious:true },
    { from:"hongkong",to:"seoul",   type:"flight", dist:"2050km",price:"¥2200", flight:"CX416", airline:"国泰航空", depAirport:"香港国际", arrAirport:"首尔仁川", plane:"A350", size:"大", dubious:true },
    { from:"hongkong",to:"tokyo",   type:"flight", dist:"2800km",price:"¥2800", flight:"CX500", airline:"国泰航空", depAirport:"香港国际", arrAirport:"东京成田", plane:"B777", size:"大", dubious:true },
    { from:"guangzhou",to:"tokyo",  type:"flight", dist:"2800km",price:"¥2300", flight:"CZ385", airline:"中国南方航空", depAirport:"广州白云", arrAirport:"东京成田", plane:"B787", size:"大", transfer:true, transferCity:"上海浦东", airline2:"中国东方航空", flight2:"MU523", dubious:true }
  ];

  // Default visible: only real routes (indices 0-4)
  var defaultVisible = [0,1,2,3,4];
  var hiddenRoutes = {};
  routes.forEach(function(r, i) {
    if (defaultVisible.indexOf(i) === -1) hiddenRoutes[i] = true;
  });

  var svg = document.getElementById("planSvg");
  var tooltip = document.getElementById("tooltip");
  var mapWrap = document.getElementById("planMapWrap");
  var cmap = {}; cities.forEach(function(c){ cmap[c.id]=c; });
  var hiddenCities = { xian:true, beijing:true, shanghai:true };
  var showDist = false;
  var showPrice = true;
  var zoomLevel = 1;
  var currentFilter = "all";

  function render() {
    var h = "";
    // Region labels
    h += '<text x="420" y="35" fill="var(--text-muted)" font-size="12" font-weight="600" letter-spacing="0.15em">CHINA</text>';
    h += '<text x="655" y="60" fill="var(--text-muted)" font-size="12" font-weight="600" letter-spacing="0.15em">KOREA</text>';
    h += '<text x="810" y="115" fill="var(--text-muted)" font-size="12" font-weight="600" letter-spacing="0.15em">JAPAN</text>';
    h += '<text x="630" y="155" fill="var(--text-muted)" font-size="10" letter-spacing="0.18em">黄 海</text>';
    h += '<text x="720" y="260" fill="var(--text-muted)" font-size="10" letter-spacing="0.18em">东 海</text>';

    routes.forEach(function(r, idx) {
      if (hiddenCities[r.from] || hiddenCities[r.to]) return;
      if (hiddenRoutes[idx]) return;
      if (currentFilter === "flight" && r.type !== "flight") return;
      if (currentFilter === "rail" && r.type !== "rail") return;
      var a = cmap[r.from], b = cmap[r.to];
      var isFlight = r.type === "flight";
      var cls = isFlight ? "flight" : "rail";
      // Invisible wide hit area
      h += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" class="route-hit" data-route="'+idx+'"/>';
      // Visible route line
      h += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" class="route-'+cls+'"/>';
      // Label
      if (showDist || showPrice) {
        var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
        var offY = isFlight ? -12 : 14;
        var parts = [];
        if (showDist) parts.push(r.dist);
        if (showPrice) parts.push(r.price);
        h += '<text x="'+mx+'" y="'+(my+offY)+'" text-anchor="middle" class="route-label">'+parts.join(' · ')+'</text>';
      }
    });

    cities.forEach(function(c) {
      if (hiddenCities[c.id]) return;
      var ax = c.la === "start" ? c.x+c.lx : c.x+c.lx;
      var anchor = c.la === "start" ? "start" : "end";
      h += '<circle cx="'+c.x+'" cy="'+c.y+'" r="5.5" class="city-dot" id="dot-'+c.id+'"/>';
      h += '<text x="'+ax+'" y="'+(c.y+c.ly)+'" text-anchor="'+anchor+'" class="city-label">'+c.name+'</text>';
    });

    svg.innerHTML = h;
    bindRouteHover();
  }

  function bindRouteHover() {
    svg.querySelectorAll(".route-hit").forEach(function(line) {
      var idx = parseInt(line.dataset.route);
      var r = routes[idx];
      line.addEventListener("mouseenter", function(e) {
        var rect = mapWrap.getBoundingClientRect();
        var x = e.clientX - rect.left + 14;
        var y = e.clientY - rect.top - 10;
        // Keep tooltip inside map bounds
        if (x + 260 > rect.width) x = e.clientX - rect.left - 270;
        if (y + 120 > rect.height) y = e.clientY - rect.top - 130;
        if (x < 0) x = 10;
        if (y < 0) y = 10;
        var isFlight = r.type === "flight";
        var cls = isFlight ? "tt-flight" : "tt-rail";
        var titleTag = isFlight?'✈ 航班':'🚄 列车';
        if (r.dubious) titleTag += ' ❓存疑';
        var body;
        if (isFlight) {
          if (r.transfer) {
            body = '第一程：'+r.airline+' '+r.flight+'<br>'+
              r.depAirport+' → '+r.arrAirport+'<br>'+
              r.plane+'（'+r.size+'） '+r.time+'<br>'+
              '第二程：'+r.airline2+' '+r.flight2+'<br>'+
              r.depAirport2+' → '+r.arrAirport2+'<br>'+
              r.plane2+'（'+r.size2+'） '+r.time2;
          } else {
            body = (r.flight||'')+'　'+r.airline+'<br>'+
              r.depAirport+' → '+r.arrAirport+'<br>'+
              r.plane+'（'+r.size+'） '+ (r.time||'');
          }
        } else {
          body = '车次：'+r.train+'<br>线路：'+r.info+'　席别：二等座';
        }
        var footer = '';
        if (r.note) footer = '<br><span style="color:var(--text-muted);font-size:0.7rem">'+r.note+'</span>';
        tooltip.innerHTML =
          '<span class="'+cls+'">'+titleTag+'</span><br>'+
          '<strong>'+cmap[r.from].name+' → '+cmap[r.to].name+'</strong><br>'+
          '票价：'+r.price+ (r.dist!=='—'?'　距离：'+r.dist:'') +'<br>'+
          body + footer;
        tooltip.style.display = "block";
        tooltip.style.left = x + "px";
        tooltip.style.top = y + "px";
      });
      line.addEventListener("mouseleave", function() {
        tooltip.style.display = "none";
      });
      line.addEventListener("mousemove", function(e) {
        var rect = mapWrap.getBoundingClientRect();
        var tx = e.clientX - rect.left + 14;
        var ty = e.clientY - rect.top - 10;
        if (tx + 260 > rect.width) tx = e.clientX - rect.left - 270;
        if (ty + 120 > rect.height) ty = e.clientY - rect.top - 130;
        if (tx < 0) tx = 10;
        if (ty < 0) ty = 10;
        tooltip.style.left = tx + "px";
        tooltip.style.top = ty + "px";
      });
    });
  }

  // Sidebar
  function buildSidebar() {
    var sidebar = document.getElementById("planSidebar");
    var regions = { china:"CHINA", korea:"KOREA", japan:"JAPAN" };
    var h = '<div class="plan-filter">';
    h += '<button data-filter="all" class="active">全部</button>';
    h += '<button data-filter="flight">仅飞机</button>';
    h += '<button data-filter="rail">仅铁路</button>';
    h += '</div>';
    h += '<label style="margin-bottom:0.15rem"><input type="checkbox" onchange="toggleDist()"> 显示路程</label>';
    h += '<label style="margin-bottom:0.3rem"><input type="checkbox" checked onchange="togglePrice()"> 显示价格</label>';
    h += '<button id="routeEditBtn" style="width:100%;padding:0.25rem 0;font-size:0.68rem;font-family:var(--font-sans);background:var(--bg-card);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);cursor:pointer;">详细设置 ▼</button>';
    h += '<div id="routeEditPanel" style="display:none;max-height:250px;overflow-y:auto;margin-top:0.3rem;">';
    h += '<span class="region-title">真实数据</span>';
    routes.forEach(function(r, i) {
      if (r.dubious && i === routes.findIndex(function(x){return x.dubious;})) {
        h += '<span class="region-title" style="margin-top:0.8rem">存疑路线</span>';
      }
      var isFlight = r.type === "flight";
      var icon = isFlight ? "✈" : "🚄";
      var dub = r.dubious ? " ❓" : "";
      var chk = hiddenRoutes[i] ? '' : ' checked';
      h += '<label style="font-size:0.65rem;padding:0.15rem 0.3rem;"><input type="checkbox"'+chk+' onchange="toggleRoute('+i+')">'+icon+' '+cmap[r.from].name+'→'+cmap[r.to].name+dub+'</label>';
    });
    h += '</div>';
    var lastRegion = "";
    cities.forEach(function(c) {
      if (c.region !== lastRegion) {
        h += '<span class="region-title">'+regions[c.region]+'</span>';
        lastRegion = c.region;
      }
      var chk = hiddenCities[c.id] ? '' : ' checked';
      var en = c.en && c.region !== "china" ? ' <span style="color:var(--text-muted);font-size:0.6rem">'+c.en+'</span>' : '';
      h += '<label><input type="checkbox"'+chk+' onchange="toggleCity(\''+c.id+'\')">'+c.name+en+'</label>';
    });
    sidebar.innerHTML = h;

    sidebar.querySelectorAll(".plan-filter button").forEach(function(btn) {
      btn.addEventListener("click", function() {
        sidebar.querySelectorAll(".plan-filter button").forEach(function(b){ b.classList.remove("active"); });
        this.classList.add("active");
        currentFilter = this.dataset.filter;
        render();
      });
    });

    document.getElementById("routeEditBtn").addEventListener("click", function() {
      var panel = document.getElementById("routeEditPanel");
      var show = panel.style.display === "none";
      panel.style.display = show ? "block" : "none";
      this.textContent = show ? "详细设置 ▲" : "详细设置 ▼";
    });
  }
  buildSidebar();

  window.toggleRoute = function(idx) {
    hiddenRoutes[idx] = !hiddenRoutes[idx];
    render();
  };

  window.toggleCity = function(id) {
    hiddenCities[id] = !hiddenCities[id];
    render();
  };
  window.toggleDist = function() {
    showDist = !showDist;
    render();
  };
  window.togglePrice = function() {
    showPrice = !showPrice;
    render();
  };

  // Mouse wheel zoom centered on cursor
  mapWrap.addEventListener("wheel", function(e) {
    e.preventDefault();
    var rect = mapWrap.getBoundingClientRect();
    var ox = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
    var oy = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
    var delta = e.deltaY > 0 ? -0.12 : 0.12;
    zoomLevel = Math.max(0.6, Math.min(2.5, zoomLevel + delta));
    svg.style.transform = "scale(" + zoomLevel + ")";
    svg.style.transformOrigin = ox + "% " + oy + "%";
  }, { passive: false });

  render();
})();
  </script>
</body>
</html>
