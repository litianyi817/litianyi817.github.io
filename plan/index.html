<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Litianyi's travel plan - interactive route map.">
  <title>Plan - Litianyi</title>
  <link rel="preload" href="/assets/bg.png" as="image">
  <link rel="stylesheet" href="/style.css?v=20">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>L</text></svg>">
  <style>
    .plan-wrap {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .plan-map {
      flex: 1;
      min-width: 0;
    }
    .plan-map svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .plan-sidebar {
      width: 150px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .plan-sidebar label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .plan-sidebar label:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }
    .plan-sidebar input[type=checkbox] {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
    }
    .plan-sidebar .region-title {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-top: 0.5rem;
      margin-bottom: 0.15rem;
      padding-left: 0.5rem;
    }
    .plan-legend {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .plan-legend span { display: flex; align-items: center; gap: 0.3rem; }
    .legend-rail { width: 20px; height: 2px; background: #3b82f6; border-radius: 1px; }
    .legend-flight { width: 20px; height: 0; border-top: 1.5px dashed rgba(255,255,255,0.5); }
    .legend-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

    @media (max-width: 768px) {
      .plan-wrap { flex-direction: column; }
      .plan-sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 0.25rem; }
      .plan-sidebar .region-title { width: 100%; margin-top: 0.2rem; }
      .plan-sidebar label { font-size: 0.7rem; padding: 0.2rem 0.4rem; }
    }
  </style>
</head>
<body>

  <div id="header"></div>

  <main>
    <div class="glass-panel">
      <div class="glass-panel-header">
        <a href="/" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          返回首页
        </a>
        <h1>Plan</h1>
        <p>旅行规划 · 东亚路线图</p>
      </div>
      <div class="glass-panel-body">
        <div class="plan-wrap">
          <div class="plan-sidebar" id="planSidebar"></div>
          <div class="plan-map">
            <svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" id="planSvg"></svg>
            <div class="plan-legend">
              <span><span class="legend-rail"></span> 铁路</span>
              <span><span class="legend-flight"></span> 航空</span>
              <span><span class="legend-dot"></span> 城市</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/script.js?v=20"></script>
  <script>
(function() {
  var cities = [
    { id:"beijing",  name:"北京", x:450,y:90,  region:"china" },
    { id:"xian",     name:"西安", x:350,y:200, region:"china" },
    { id:"chengdu",  name:"成都", x:230,y:310, region:"china" },
    { id:"shanghai", name:"上海", x:540,y:260, region:"china" },
    { id:"guangzhou",name:"广州", x:400,y:420, region:"china" },
    { id:"hongkong", name:"香港", x:440,y:460, region:"china" },
    { id:"seoul",    name:"首尔", x:580,y:75,  region:"korea" },
    { id:"busan",    name:"釜山", x:625,y:170, region:"korea" },
    { id:"jeju",     name:"济州", x:545,y:195, region:"korea" },
    { id:"tokyo",    name:"东京", x:750,y:130, region:"japan" },
    { id:"osaka",    name:"大阪", x:715,y:210, region:"japan" }
  ];

  var routes = [
    { from:"beijing",to:"xian",     type:"rail",   dist:"910km", price:"¥515" },
    { from:"beijing",to:"shanghai", type:"rail",   dist:"1210km",price:"¥553" },
    { from:"xian",   to:"chengdu",  type:"rail",   dist:"660km", price:"¥263" },
    { from:"shanghai",to:"guangzhou",type:"rail",  dist:"1400km",price:"¥730" },
    { from:"guangzhou",to:"hongkong",type:"rail",  dist:"140km", price:"¥80" },
    { from:"seoul",  to:"busan",    type:"rail",   dist:"330km", price:"¥300" },
    { from:"tokyo",  to:"osaka",    type:"rail",   dist:"500km", price:"¥800" },
    { from:"beijing",to:"seoul",    type:"flight", dist:"950km", price:"¥1200" },
    { from:"beijing",to:"tokyo",    type:"flight", dist:"2100km",price:"¥2500" },
    { from:"shanghai",to:"tokyo",   type:"flight", dist:"1750km",price:"¥2100" },
    { from:"shanghai",to:"osaka",   type:"flight", dist:"1400km",price:"¥1800" },
    { from:"busan",  to:"osaka",    type:"flight", dist:"550km", price:"¥900" }
  ];

  var hiddenCities = {};
  var svg = document.getElementById("planSvg");
  var cmap = {}; cities.forEach(function(c){ cmap[c.id]=c; });

  function render() {
    var h = "";
    // Background hints
    h += '<text x="380" y="30" fill="var(--text-muted)" font-size="11" font-weight="600" letter-spacing="0.15em">CHINA</text>';
    h += '<text x="585" y="55" fill="var(--text-muted)" font-size="11" font-weight="600" letter-spacing="0.15em">KOREA</text>';
    h += '<text x="725" y="110" fill="var(--text-muted)" font-size="11" font-weight="600" letter-spacing="0.15em">JAPAN</text>';
    h += '<text x="570" y="150" fill="var(--text-muted)" font-size="9" letter-spacing="0.15em">黄 海</text>';
    h += '<text x="650" y="230" fill="var(--text-muted)" font-size="9" letter-spacing="0.15em">东 海</text>';

    // Routes
    routes.forEach(function(r) {
      if (hiddenCities[r.from] || hiddenCities[r.to]) return;
      var a = cmap[r.from], b = cmap[r.to];
      var isFlight = r.type === "flight";
      var cls = isFlight ? "flight" : "rail";
      h += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" class="route-'+cls+'"/>';
      // Label at midpoint
      var mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      var offX = isFlight ? 8 : -10, offY = isFlight ? -10 : 8;
      h += '<text x="'+(mx+offX)+'" y="'+(my+offY)+'" class="route-label">'+r.dist+' · '+r.price+'</text>';
    });

    // Cities
    cities.forEach(function(c) {
      if (hiddenCities[c.id]) return;
      h += '<circle cx="'+c.x+'" cy="'+c.y+'" r="5" class="city-dot" id="dot-'+c.id+'"/>';
      h += '<text x="'+(c.x+8)+'" y="'+(c.y-6)+'" class="city-label">'+c.name+'</text>';
    });

    svg.innerHTML = h;
  }

  // Sidebar
  var sidebar = document.getElementById("planSidebar");
  var regions = { china:"CHINA", korea:"KOREA", japan:"JAPAN" };
  var lastRegion = "";
  var sh = "";
  cities.forEach(function(c) {
    if (c.region !== lastRegion) {
      sh += '<span class="region-title">'+regions[c.region]+'</span>';
      lastRegion = c.region;
    }
    sh += '<label><input type="checkbox" checked onchange="toggleCity(\''+c.id+'\')">'+c.name+'</label>';
  });
  sidebar.innerHTML = sh;

  window.toggleCity = function(id) {
    hiddenCities[id] = !hiddenCities[id];
    var dot = document.getElementById("dot-"+id);
    render();
  };

  render();
})();
  </script>
  <style>
    .route-rail {
      stroke: #3b82f6;
      stroke-width: 2;
      fill: none;
      opacity: 0.7;
    }
    .route-flight {
      stroke: rgba(255,255,255,0.55);
      stroke-width: 1.5;
      stroke-dasharray: 6 5;
      fill: none;
    }
    .route-label {
      fill: var(--text-muted);
      font-size: 9px;
      font-family: var(--font-sans);
    }
    .city-dot { fill: var(--accent); stroke: var(--bg-primary); stroke-width: 1.5; }
    .city-label { fill: var(--text-secondary); font-size: 13px; font-family: var(--font-sans); }
    @media (max-width: 600px) {
      .city-label { font-size: 10px; }
      .route-label { font-size: 7px; }
    }
  </style>
</body>
</html>
