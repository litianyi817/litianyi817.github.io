<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal - Litianyi</title>
<link rel="preload" href="/assets/bg.png" as="image">
<link rel="stylesheet" href="/style.css?v=37">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>L</text></svg>">
<style>
/* Password gate */
.gate-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex; align-items: center; justify-content: center;
}
.gate-box {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 2.5rem; text-align: center;
  max-width: 360px; width: 90%;
}
.gate-box h2 { margin-bottom: 0.3rem; }
.gate-box p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.2rem; }
.gate-box input {
  width: 100%; padding: 0.6rem 1rem; font-size: 1rem; font-family: var(--font-mono);
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text-primary); text-align: center; letter-spacing: 0.1em;
  outline: none; transition: border-color 0.2s;
}
.gate-box input:focus { border-color: var(--accent); }
.gate-box .gate-err { font-size: 0.72rem; color: #ef4444; margin-top: 0.5rem; min-height: 1.2em; }
.gate-box button {
  margin-top: 0.8rem; padding: 0.5rem 2.5rem; font-size: 0.85rem; font-family: var(--font-sans);
  background: var(--accent); border: none; border-radius: 8px; color: #fff; cursor: pointer;
}

/* Tabs */
.personal-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.personal-tab {
  padding: 0.4rem 1.2rem; font-size: 0.8rem; font-family: var(--font-sans);
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.personal-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.personal-tab:hover { color: var(--text-primary); }

/* Schedule */
.schedule-wrap { max-width: 700px; margin: 0 auto; }
.schedule-day { margin-bottom: 1.2rem; }
.schedule-day-title {
  font-size: 0.85rem; font-weight: 600; color: var(--text-primary);
  padding: 0.4rem 0.8rem; background: var(--bg-card); border-radius: 6px;
  margin-bottom: 0.5rem; border-left: 3px solid var(--accent);
}
.schedule-courses { display: grid; gap: 0.4rem; }
.schedule-course {
  display: grid; grid-template-columns: 120px 1fr 100px;
  gap: 0.5rem; align-items: center;
  padding: 0.5rem 0.8rem; background: rgba(255,255,255,0.02);
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.78rem;
}
.schedule-course .sc-time { color: var(--accent); font-family: var(--font-mono); font-size: 0.7rem; }
.schedule-course .sc-name { color: var(--text-primary); font-weight: 500; }
.schedule-course .sc-meta { color: var(--text-muted); font-size: 0.68rem; }
.schedule-course .sc-room { color: var(--text-muted); font-size: 0.7rem; text-align: right; }
.schedule-course.upcoming { border-color: #f59e0b; background: rgba(245,158,11,0.06); }
.schedule-day-title.today { border-left-color: #f59e0b; }
.schedule-empty { text-align: center; color: var(--text-muted); padding: 1.5rem; font-size: 0.8rem; }

/* Photos */
.photos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.8rem; }
.photo-card { cursor: pointer; transition: transform 0.2s; }
.photo-card:hover { transform: translateY(-2px); }
.photo-thumb {
  aspect-ratio: 4/5; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-md); overflow: hidden;
}
.photo-name { font-size: 0.72rem; color: var(--text-muted); text-align: center; margin-top: 0.3rem; }
.photo-overlay {
  position: fixed; inset: 0; z-index: 600; background: rgba(0,0,0,0.85);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
}
.photo-modal {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 2rem; text-align: center; max-width: 500px; width: 90%;
  position: relative;
}
.photo-close {
  position: absolute; top: 0.8rem; right: 1rem;
  background: none; border: none; color: var(--text-secondary); font-size: 1.5rem;
  cursor: pointer; line-height: 1;
}
.photo-placeholder {
  aspect-ratio: 1; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-md); display: flex; align-items: center;
  justify-content: center; color: var(--text-muted); font-size: 0.75rem;
  cursor: pointer; transition: all 0.2s;
}
.photo-placeholder:hover { border-color: var(--border-hover); color: var(--text-secondary); }

.report-preview {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
  cursor: pointer; transition: all 0.2s;
}
.report-preview:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.report-icon { font-size: 2.5rem; }
.report-name { font-size: 0.78rem; color: var(--text-secondary); word-break: break-all; }

/* Food */
.food-list { display: flex; flex-direction: column; gap: 0.35rem; }
.food-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.45rem 0.7rem; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; font-size: 0.78rem;
}
.food-name { color: var(--text-primary); font-weight: 500; }
.food-loc { color: var(--text-muted); font-size: 0.68rem; margin-left: 0.5rem; }
.food-rating { font-size: 0.75rem; margin-left: 0.4rem; font-weight: 600; }
.food-note { font-size: 0.65rem; color: var(--text-muted); margin-left: 0.5rem; }
.food-splus { color: #f59e0b; }
.food-s { color: #ef4444; }
.food-a { color: #c084fc; }
.food-b { color: var(--text-secondary); }
.food-c { color: var(--text-muted); }

@media (max-width: 600px) {
  .schedule-course { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Password Gate -->
<div class="gate-overlay" id="gateOverlay">
  <div class="gate-box">
    <h2>🔒 Personal</h2>
    <p>请输入密码以继续</p>
    <input type="password" id="gateInput" placeholder="········" maxlength="20" autofocus>
    <div class="gate-err" id="gateErr"></div>
    <button onclick="checkPassword()">验证</button>
  </div>
</div>

<div id="header"></div>
<main>
<div class="glass-panel" style="max-width:900px">
  <div class="glass-panel-header">
    <a href="/" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回首页</a>
    <h1>Personal</h1>
  </div>
  <div class="glass-panel-body">
    <div class="personal-tabs">
      <button class="personal-tab active" data-tab="schedule">📅 课表</button>
      <button class="personal-tab" data-tab="photos">📷 照片</button>
      <button class="personal-tab" data-tab="report">📋 报告</button>
      <button class="personal-tab" data-tab="food">🍽 FOOD</button>
    </div>
    <div id="tabContent"></div>
  </div>
</div>
</main>
<div id="footer"></div>
<script src="/script.js?v=37"></script>
<script>
// SHA-256 hash of password "070817"
var PASS_HASH = "9d6659d19f89f2acc94540667a00069dc61529d4e3b42baaaeac8b61548a293f";
var unlocked = false;

async function checkPassword() {
  var input = document.getElementById("gateInput").value;
  var errEl = document.getElementById("gateErr");
  if (!input) { errEl.textContent = "请输入密码"; return; }
  var data = new TextEncoder().encode(input);
  var hashBuf = await crypto.subtle.digest("SHA-256", data);
  var hashHex = Array.from(new Uint8Array(hashBuf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  if (hashHex === PASS_HASH) {
    unlocked = true;
    document.getElementById("gateOverlay").remove();
  } else {
    errEl.textContent = "密码错误";
    document.getElementById("gateInput").value = "";
  }
}

// Enter key to submit
document.getElementById("gateInput").addEventListener("keydown", function(e) { if(e.key==="Enter") checkPassword(); });

// Tab switching
var currentTab = "schedule";
document.querySelectorAll(".personal-tab").forEach(function(tab) {
  tab.addEventListener("click", function() {
    document.querySelectorAll(".personal-tab").forEach(function(t){ t.classList.remove("active"); });
    this.classList.add("active");
    currentTab = this.dataset.tab;
    renderTab();
  });
});

function renderTab() {
  if (!unlocked) return;
  if (currentTab === "schedule") renderSchedule();
  else if (currentTab === "photos") renderPhotos();
  else if (currentTab === "report") renderReport();
  else if (currentTab === "food") renderFood();
}

function parseTime(t) {
  var parts = t.split("-")[0].split(":");
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}
function getPeriod(h) {
  if (h < 12) return "上午";
  if (h < 14) return "中午";
  if (h < 18) return "下午";
  return "晚上";
}
function renderSchedule() {
  fetch("/personal/课表.json?v=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(days) {
      var now = new Date();
      var nowDay = now.getDay();
      var nowMin = now.getHours() * 60 + now.getMinutes();
      var todayIdx = nowDay === 0 ? 6 : nowDay - 1;

      // Find upcoming course
      var upcoming = null, upcomingDay = null;
      days.forEach(function(day, di) {
        day.courses.forEach(function(c) {
          var start = parseTime(c.time);
          var offset = (di - todayIdx) * 1440 + start - nowMin;
          if (offset > 0 && (upcoming === null || offset < upcoming._off)) {
            upcoming = c; upcoming._off = offset; upcomingDay = di;
          }
        });
      });

      var h = '<div class="schedule-wrap">';
      days.forEach(function(day, di) {
        var isToday = di === todayIdx;
        var titleCls = 'schedule-day-title' + (isToday ? ' today' : '');
        var titleExtra = isToday ? ' <span style="color:#f59e0b;font-size:0.7rem">今天</span>' : '';
        h += '<div class="schedule-day"><div class="'+titleCls+'">'+day.day+titleExtra+'</div><div class="schedule-courses">';
        if (day.courses.length === 0) {
          h += '<div class="schedule-empty">今日无课 🌟</div>';
        } else {
          day.courses.forEach(function(c) {
            var isUpcoming = upcoming && di === upcomingDay && c.time === upcoming.time && c.name === upcoming.name;
            var startH = parseInt(c.time.split("-")[0].split(":")[0]);
            var period = getPeriod(startH);
            var cls = 'schedule-course' + (isUpcoming ? ' upcoming' : '');
            h += '<div class="'+cls+'">';
            h += '<div><span class="sc-time">'+period+' '+c.time+'</span></div>';
            h += '<div><span class="sc-name">'+c.name+'</span><br><span class="sc-meta">'+c.code+' · '+c.teacher+' · '+c.weeks+'</span></div>';
            h += '<div class="sc-room">'+c.classroom+(isUpcoming?'<br><span style="color:#f59e0b;font-size:0.65rem">▶ 即将开始</span>':'')+'</div>';
            h += '</div>';
          });
        }
        h += '</div></div>';
      });
      h += '</div>';
      document.getElementById("tabContent").innerHTML = h;
    })
    .catch(function() {
      document.getElementById("tabContent").innerHTML = '<div class="schedule-empty">课表加载失败</div>';
    });
}

function renderPhotos() {
  var photos = [
    { name:"证件照", file:"/personal/证件照.jpg", date:"2026" }
  ];
  var h = '<div class="photos-grid">';
  photos.forEach(function(p) {
    h += '<div class="photo-card" onclick="previewPhoto(\''+p.file+'\',\''+p.name+'\')">';
    h += '<div class="photo-thumb"><img src="'+p.file+'" alt="'+p.name+'" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>';
    h += '<div class="photo-name">'+p.name+'</div></div>';
  });
  h += '</div>';
  document.getElementById("tabContent").innerHTML = h;
}

function previewPhoto(src, name) {
  var overlay = document.createElement("div");
  overlay.className = "photo-overlay";
  overlay.innerHTML = '<div class="photo-modal">'+
    '<button class="photo-close" onclick="this.parentElement.parentElement.remove()">&times;</button>'+
    '<img src="'+src+'" alt="'+name+'" style="max-width:100%;max-height:50vh;border-radius:8px;margin-bottom:1rem">'+
    '<p style="color:var(--text-primary);font-weight:600;margin-bottom:0.8rem">'+name+'</p>'+
    '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center">'+
    '<a href="'+src+'" download class="game-btn small" style="text-decoration:none">📥 原图</a>'+
    '<button class="game-btn small" onclick="resizeAndDownload(\''+src+'\',25,35,\'1寸\')">📐 1寸 (25×35mm)</button>'+
    '<button class="game-btn small" onclick="resizeAndDownload(\''+src+'\',35,49,\'2寸\')">📐 2寸 (35×49mm)</button>'+
    '</div></div>';
  overlay.addEventListener("click", function(e){ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function resizeAndDownload(src, wMm, hMm, label) {
  var img = new Image(); img.crossOrigin = "anonymous";
  img.onload = function() {
    var dpr = window.devicePixelRatio || 1;
    var wPx = Math.round(wMm * dpr * 11.8);
    var hPx = Math.round(hMm * dpr * 11.8);
    var c = document.createElement("canvas");
    c.width = wPx; c.height = hPx;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, wPx, hPx);
    var s = Math.min(wPx / img.width, hPx / img.height);
    var iw = img.width * s, ih = img.height * s;
    ctx.drawImage(img, (wPx-iw)/2, (hPx-ih)/2, iw, ih);
    var a = document.createElement("a");
    a.download = "证件照_"+label+".png";
    a.href = c.toDataURL("image/png");
    a.click();
  };
  img.src = src;
}

// Report
var REPORT_EXPIRY = new Date("2026-08-25");

function renderReport() {
  var now = new Date();
  var expired = now > REPORT_EXPIRY;
  var daysLeft = Math.ceil((REPORT_EXPIRY - now) / (1000*60*60*24));
  var h = '<div style="max-width:500px;margin:0 auto;text-align:center">';
  h += '<div style="font-size:1rem;color:var(--text-primary);font-weight:600;margin-bottom:0.5rem">📋 学籍在线验证报告</div>';
  h += '<div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:1.2rem">教育部学籍在线验证报告 · 李天一</div>';
  h += '<div class="report-preview"><div class="report-icon">📄</div><div class="report-name">教育部学籍在线验证报告_李天一.pdf</div></div>';
  if (expired) {
    h += '<div style="margin-top:1rem;padding:0.6rem 1rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;color:#ef4444;font-size:0.78rem">⚠ 报告已于 '+REPORT_EXPIRY.toLocaleDateString("zh-CN")+' 过期，请更新</div>';
  } else {
    h += '<div style="margin-top:1rem;padding:0.6rem 1rem;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);border-radius:8px;color:#4ade80;font-size:0.78rem">✅ 报告有效 · 剩余 '+daysLeft+' 天（至 '+REPORT_EXPIRY.toLocaleDateString("zh-CN")+'）</div>';
  }
  h += '<div style="margin-top:1rem;display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap">';
  h += '<a href="/personal/教育部学籍在线验证报告_李天一.pdf" target="_blank" class="game-btn" style="text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem">👁 在线查看</a>';
  h += '<a href="/personal/教育部学籍在线验证报告_李天一.pdf" download class="game-btn primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem">📥 下载 PDF</a>';
  h += '</div></div>';
  document.getElementById("tabContent").innerHTML = h;
}

// Food (read-only)
var foodSubTab = "plan";
var RATINGS = { "S+":"夯爆了", "S":"夯", "A":"人上人", "B":"NPC", "C":"路边一条" };
var RATING_CLASS = { "S+":"food-splus", "S":"food-s", "A":"food-a", "B":"food-b", "C":"food-c" };

var foodPlanned = [
  { name:"待探索的美食", loc:"敬请期待" }
];
var foodReviews = [
  { name:"示例餐厅", rating:"S", note:"值得专程前往" }
];

function renderFood() {
  var h = '<div style="max-width:600px;margin:0 auto">';
  h += '<div class="personal-tabs" style="margin-bottom:1rem">';
  h += '<button class="personal-tab '+(foodSubTab==="plan"?"active":"")+'" onclick="switchFoodTab(\'plan\')">📝 计划中</button>';
  h += '<button class="personal-tab '+(foodSubTab==="review"?"active":"")+'" onclick="switchFoodTab(\'review\')">⭐ 用餐评价</button>';
  h += '</div>';
  if (foodSubTab === "plan") h += renderFoodPlan();
  else h += renderFoodReview();
  h += '</div>';
  document.getElementById("tabContent").innerHTML = h;
}

function switchFoodTab(t) { foodSubTab = t; renderFood(); }

function renderFoodPlan() {
  var h = '';
  if (foodPlanned.length === 0) {
    h += '<div class="schedule-empty">还没有计划 🍜</div>';
  } else {
    h += '<div class="food-list">';
    foodPlanned.forEach(function(item) {
      h += '<div class="food-item"><span class="food-name">'+item.name+'</span><span class="food-loc">'+item.loc+'</span></div>';
    });
    h += '</div>';
  }
  return h;
}

function renderFoodReview() {
  var h = '';
  if (foodReviews.length === 0) {
    h += '<div class="schedule-empty">还没有评价 🍽</div>';
  } else {
    h += '<div class="food-list">';
    foodReviews.forEach(function(item) {
      var cls = RATING_CLASS[item.rating] || "";
      h += '<div class="food-item"><span class="food-name">'+item.name+'</span><span class="food-rating '+cls+'">'+item.rating+' · '+RATINGS[item.rating]+'</span>';
      if (item.note) h += '<span class="food-note">'+item.note+'</span>';
      h += '</div>';
    });
    h += '</div>';
  }
  return h;
}

// Init
renderSchedule();
</script>
</body>
</html>
